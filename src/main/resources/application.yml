server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: nexo-citas-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:citas_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

keycloak:
  enabled: ${KEYCLOAK_ENABLED:true}
  host: ${KEYCLOAK_HOST:https://nexoauth.app.goline.com.co}
  realm: ${KEYCLOAK_REALM:nexo2.0}
  client-id: ${KEYCLOAK_CLIENT_ID:nexo-gateway-service}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:NexoGatewaySecret2026KeycloakServiceAccount}

# Integracion por eventos (Outbox): Facturacion, Admin Core
nexo:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  personal-service:
    url: ${PERSONAL_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.nexo: ${LOG_LEVEL_NEXO:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE:INFO}
